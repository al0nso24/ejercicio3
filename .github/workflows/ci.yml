name: CI - Pruebas automáticas

#¿Cuándo se ejecuta? En cada push o pull request a main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas:
    #Máquina virtual de GitHub
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v4

      - name: 2. Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Ejecutar las pruebas
        run: npm test